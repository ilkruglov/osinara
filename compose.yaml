services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: osinara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: osinara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osinara -d osinara"]
      interval: 15s
      timeout: 3s
      retries: 7
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  agent:
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      memory-embedding:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://osinara:${POSTGRES_PASSWORD}@postgres:5432/osinara
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID-}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN-}
      GROQ_API_KEY: ${GROQ_API_KEY-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID-}
      NEURALDEEP_IMAGE_API_KEY: ${NEURALDEEP_IMAGE_API_KEY-}
      PLUSVIBE_API_KEY: ${PLUSVIBE_API_KEY-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET-}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY-}
      INVITATION_SIGNING_SECRET: ${INVITATION_SIGNING_SECRET:?INVITATION_SIGNING_SECRET is required}
      MEMORY_EMBEDDING_BASE_URL: http://memory-embedding:80
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:?TELEGRAM_WEBHOOK_SECRET_TOKEN is required}
      WORKFLOW_POSTGRES_JOB_PREFIX: osinara
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: ${WORKFLOW_POSTGRES_MAX_POOL_SIZE-32}
      WORKFLOW_POSTGRES_URL: ${WORKFLOW_POSTGRES_URL:?WORKFLOW_POSTGRES_URL is required}
      # Load runs, 3 October 2026 (stress/load-families): 3 drains capped the bot at ~30 turns a
      # minute, Workflow concurrency 10 at ~95; 1 000 families of 100 messages a day (~104 a minute)
      # kept a steady queue only at 20 drains and 30 steps (answer p50 7.3 s over a 5 s model).
      # Tuning profiles: see compose.production.yaml; the defaults are the single-family profile.
      TELEGRAM_INGRESS_MAX_CONCURRENT_DRAINS: ${TELEGRAM_INGRESS_MAX_CONCURRENT_DRAINS-20}
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: ${WORKFLOW_POSTGRES_WORKER_CONCURRENCY-30}
      MEMORY_REVIEW_MAX_IN_FLIGHT: ${MEMORY_REVIEW_MAX_IN_FLIGHT-2}
      MEMORY_REVIEW_MATERIALIZE_LANE_LIMIT: ${MEMORY_REVIEW_MATERIALIZE_LANE_LIMIT-200}
      AGENT_HEAP_MB: ${AGENT_HEAP_MB-512}
      TELEGRAM_PRIVATE_BURST_QUIET_MS: ${TELEGRAM_PRIVATE_BURST_QUIET_MS-2000}
      TELEGRAM_PRIVATE_BURST_MAX_WAIT_MS: ${TELEGRAM_PRIVATE_BURST_MAX_WAIT_MS-20000}
      TELEGRAM_SEND_GLOBAL_PER_SECOND: ${TELEGRAM_SEND_GLOBAL_PER_SECOND-25}
      TELEGRAM_SEND_GROUP_PER_MINUTE: ${TELEGRAM_SEND_GROUP_PER_MINUTE-20}
      TELEGRAM_SEND_PRIVATE_GAP_MS: ${TELEGRAM_SEND_PRIVATE_GAP_MS-250}
      WORKFLOW_QUEUE_NAMESPACE: eve6f73696e6172612d66616d696c792d6167656e74
      OSINARA_WORKFLOW_PAYLOAD_BLOBS: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/eve/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - default
      - sandbox-control
    volumes:
      - ./config/agent-model-providers.json:/app/config/agent-model-providers.json:ro
      - google-workspace-credentials:/app/google-workspace-credentials
      - sandbox-data:/app/.eve/sandbox-cache
      - workspace-data:/app/workspaces

  migrate:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npm", "run", "migrate:runtime"]
    environment:
      DATABASE_URL: postgresql://osinara:${POSTGRES_PASSWORD}@postgres:5432/osinara
      WORKFLOW_POSTGRES_URL: ${WORKFLOW_POSTGRES_URL:?WORKFLOW_POSTGRES_URL is required}
    restart: "no"

  sandbox-runtime-image:
    build:
      context: .
      target: sandbox-runtime
    command: ["true"]
    image: osinara-sandbox-runtime:local
    network_mode: none
    restart: "no"

  sandbox-runner:
    build:
      context: .
      target: sandbox-runner
    depends_on:
      sandbox-egress-proxy:
        condition: service_healthy
      sandbox-runtime-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 3s
      retries: 4
    environment:
      SANDBOX_RUNTIME_IMAGE: osinara-sandbox-runtime:local
      BROWSERLESS_API_KEY: ${BROWSERLESS_API_KEY-}
      SANDBOX_IDLE_TIMEOUT_MS: ${SANDBOX_IDLE_TIMEOUT_MS-21600000}
      SANDBOX_MAX_RUNNING_CONTAINERS: ${SANDBOX_MAX_RUNNING_CONTAINERS-1000}
    networks:
      - sandbox-control
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tool-environments:/runner/tools
      - workspace-data:/runner/workspaces

  sandbox-egress-proxy:
    build:
      context: .
      target: sandbox-egress-proxy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(3128,'127.0.0.1').on('connect',function(){this.destroy();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 4
    networks:
      - default
      - sandbox-egress
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

  memory-embedding:
    build:
      context: .
      target: memory-embedding
    image: osinara-memory-embedding:local
    cpus: 1.5
    mem_limit: 1536m
    # The image carries BERTA exported to ONNX and names the model and pooling itself
    # (Dockerfile, `memory-embedding`); the router runs its ONNX backend.
    command:
      - --tokenization-workers
      - "2"
      - --max-client-batch-size
      - "8"
      # TEI counts every text as a request: a full worker batch and a turn query arriving together
      # must both fit, or the query gets 429 and the turn searches by words only.
      - --max-concurrent-requests
      - "32"
      # The ONNX backend batches at most 8 requests.
      - --max-batch-requests
      - "8"
      - --max-batch-tokens
      - "4096"
      - --auto-truncate=false
    environment:
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 40
    restart: unless-stopped
    volumes:
      - memory-embedding-model-e5:/data

  memory-embedding-worker:
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      memory-embedding:
        condition: service_healthy
    entrypoint: ["node", ".runtime/scripts/memory-embedding-worker.js"]
    environment:
      DATABASE_URL: postgresql://osinara:${POSTGRES_PASSWORD}@postgres:5432/osinara
      MEMORY_EMBEDDING_BASE_URL: http://memory-embedding:80
    restart: unless-stopped

  telegram-ingress-worker:
    build:
      context: .
      target: runtime
    depends_on:
      - agent
    entrypoint: ["node", ".runtime/scripts/telegram-ingress-worker.js"]
    environment:
      AGENT_INTERNAL_BASE_URL: http://agent:3000
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:?TELEGRAM_WEBHOOK_SECRET_TOKEN is required}
    restart: unless-stopped

  edge:
    image: nginx:1.29-alpine
    depends_on:
      - agent
    ports:
      # Local only: the development edge has no TLS and must not listen on every interface.
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  google-workspace-credentials:
  postgres-data:
  memory-embedding-model-e5:
  sandbox-data:
  tool-environments:
  workspace-data:

networks:
  sandbox-control:
    internal: true
  sandbox-egress:
    internal: true
