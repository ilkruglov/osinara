name: osinara-production

x-bounded-json-logs: &bounded-json-logs
  driver: json-file
  options:
    max-file: "5"
    max-size: "20m"

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_DB: osinara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: osinara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osinara -d osinara"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network
    restart: unless-stopped
    logging: *bounded-json-logs
    volumes:
      - postgres-data:/var/lib/postgresql/data

  memory-embedding:
    image: ${OSINARA_MEMORY_EMBEDDING_IMAGE:?OSINARA_MEMORY_EMBEDDING_IMAGE must be an exact digest reference}
    cpus: 1.0
    mem_limit: 1536m
    # The image carries BERTA exported to ONNX and names the model and pooling itself
    # (Dockerfile, `memory-embedding`); the router runs its ONNX backend.
    command:
      - --tokenization-workers
      - "1"
      - --max-client-batch-size
      - "8"
      # TEI counts every text as a request: a full worker batch and a turn query arriving together
      # must both fit, or the query gets 429 and the turn searches by words only.
      - --max-concurrent-requests
      - "32"
      # The ONNX backend batches at most 8 requests.
      - --max-batch-requests
      - "8"
      - --max-batch-tokens
      - "4096"
      - --auto-truncate=false
    environment:
      OMP_NUM_THREADS: "1"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 120
    networks:
      - app-network
    restart: unless-stopped
    logging: *bounded-json-logs
    volumes:
      - memory-embedding-model-e5:/data


  agent:
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    command: ["start-after-migration"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      memory-embedding:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID-}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN-}
      NEURALDEEP_IMAGE_API_KEY: ${NEURALDEEP_IMAGE_API_KEY-}
      PLUSVIBE_API_KEY: ${PLUSVIBE_API_KEY-}
      GROQ_API_KEY: ${GROQ_API_KEY-}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY-}
      INVITATION_SIGNING_SECRET: ${INVITATION_SIGNING_SECRET:?INVITATION_SIGNING_SECRET is required}
      MEMORY_EMBEDDING_BASE_URL: http://memory-embedding:80
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:?TELEGRAM_WEBHOOK_SECRET_TOKEN is required}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required}
      WORKFLOW_POSTGRES_JOB_PREFIX: osinara
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: ${WORKFLOW_POSTGRES_MAX_POOL_SIZE-32}
      WORKFLOW_POSTGRES_URL: ${WORKFLOW_POSTGRES_URL:?WORKFLOW_POSTGRES_URL is required}
      # Load runs, 3 October 2026 (stress/load-families): 3 drains capped the bot at ~30 turns a
      # minute, Workflow concurrency 10 at ~95; 1 000 families of 100 messages a day (~104 a minute)
      # kept a steady queue only at 20 drains and 30 steps (answer p50 7.3 s over a 5 s model).
      # Tuning (set in the installation's .env; the defaults are the single-family profile):
      #   one family on one core        drains 20, steps 30, pool 32, review 2, heap 512,
      #                                 quiet 2000, send gap 250, sandbox idle 6 h,
      #                                 containers 1000 (runner)
      #   a thousand families, 4+ cores drains 40–60, steps 60, pool 64, review 10, heap 1024,
      #                                 send gap 1000, sandbox idle 10 min, containers ~400 on 8 GB.
      #   A drain holds its chat for the whole turn, so drains × 60 / turn seconds is the bot's
      #   turns a minute (4 October 2026: 20 drains over 13.5 s turns = 89).
      TELEGRAM_INGRESS_MAX_CONCURRENT_DRAINS: ${TELEGRAM_INGRESS_MAX_CONCURRENT_DRAINS-20}
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: ${WORKFLOW_POSTGRES_WORKER_CONCURRENCY-30}
      MEMORY_REVIEW_MAX_IN_FLIGHT: ${MEMORY_REVIEW_MAX_IN_FLIGHT-2}
      MEMORY_REVIEW_MATERIALIZE_LANE_LIMIT: ${MEMORY_REVIEW_MATERIALIZE_LANE_LIMIT-200}
      AGENT_HEAP_MB: ${AGENT_HEAP_MB-512}
      TELEGRAM_PRIVATE_BURST_QUIET_MS: ${TELEGRAM_PRIVATE_BURST_QUIET_MS-2000}
      TELEGRAM_PRIVATE_BURST_MAX_WAIT_MS: ${TELEGRAM_PRIVATE_BURST_MAX_WAIT_MS-20000}
      # Outbound Telegram pacing (Telegram's own limits are the ceilings): the private-chat gap
      # is a quarter second for one family and the full second for a thousand.
      TELEGRAM_SEND_GLOBAL_PER_SECOND: ${TELEGRAM_SEND_GLOBAL_PER_SECOND-25}
      TELEGRAM_SEND_GROUP_PER_MINUTE: ${TELEGRAM_SEND_GROUP_PER_MINUTE-20}
      TELEGRAM_SEND_PRIVATE_GAP_MS: ${TELEGRAM_SEND_PRIVATE_GAP_MS-250}
      WORKFLOW_QUEUE_NAMESPACE: eve6f73696e6172612d66616d696c792d6167656e74
      # Large repeated payload blocks of the Workflow event log are stored once (1.8.19 reads
      # them, 1.8.20 writes them): about half the bytes per turn on the load stand.
      OSINARA_WORKFLOW_PAYLOAD_BLOBS: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/eve/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 72
    networks:
      - app-network
      - sandbox-control
    restart: unless-stopped
    logging: *bounded-json-logs
    volumes:
      - /opt/osinara/agent-model-providers.json:/app/config/agent-model-providers.json:ro
      - google-workspace-credentials:/app/google-workspace-credentials
      - sandbox-data:/app/.eve/sandbox-cache
      - workspace-data:/app/workspaces

  migrate:
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npm", "run", "migrate:runtime"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      WORKFLOW_POSTGRES_URL: ${WORKFLOW_POSTGRES_URL:?WORKFLOW_POSTGRES_URL is required}
    networks:
      - app-network
    restart: "no"
    logging: *bounded-json-logs

  memory-embedding-worker:
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    depends_on:
      memory-embedding:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["node", ".runtime/scripts/memory-embedding-worker.js"]
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      MEMORY_EMBEDDING_BASE_URL: http://memory-embedding:80
    networks:
      - app-network
    restart: unless-stopped
    logging: *bounded-json-logs

  telegram-ingress-worker:
    image: ${OSINARA_APP_IMAGE:?OSINARA_APP_IMAGE must be an exact digest reference}
    depends_on:
      agent:
        condition: service_healthy
    entrypoint: ["node", ".runtime/scripts/telegram-ingress-worker.js"]
    environment:
      AGENT_INTERNAL_BASE_URL: http://agent:3000
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required}
    networks:
      - app-network
    restart: unless-stopped
    logging: *bounded-json-logs

  edge:
    image: ${OSINARA_EDGE_IMAGE:?OSINARA_EDGE_IMAGE must be an exact digest reference}
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/eve/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network
      - edge-frontend
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
    logging: *bounded-json-logs

  sandbox-runtime-image:
    image: ${SANDBOX_RUNTIME_IMAGE:?SANDBOX_RUNTIME_IMAGE must be an exact digest reference}
    command: ["true"]
    network_mode: none
    restart: "no"
    logging: *bounded-json-logs

  sandbox-runner:
    image: ${OSINARA_SANDBOX_RUNNER_IMAGE:?OSINARA_SANDBOX_RUNNER_IMAGE must be an exact digest reference}
    depends_on:
      sandbox-egress-proxy:
        condition: service_healthy
      sandbox-runtime-image:
        condition: service_completed_successfully
    environment:
      SANDBOX_RUNTIME_IMAGE: ${SANDBOX_RUNTIME_IMAGE:?SANDBOX_RUNTIME_IMAGE must be an exact digest reference}
      BROWSERLESS_API_KEY: ${BROWSERLESS_API_KEY-}
      # Idle window before a family's container is stopped: 6 h keeps one family's container warm
      # (an idle one holds under a megabyte resident); a thousand families want 10 min (600000).
      SANDBOX_IDLE_TIMEOUT_MS: ${SANDBOX_IDLE_TIMEOUT_MS-21600000}
      # Running containers at most; at the cap the least recently used idle one is stopped
      # first, and with every one in use a new command is refused.
      SANDBOX_MAX_RUNNING_CONTAINERS: ${SANDBOX_MAX_RUNNING_CONTAINERS-1000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sandbox-control
    read_only: true
    restart: unless-stopped
    logging: *bounded-json-logs
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tool-environments:/runner/tools
      - workspace-data:/runner/workspaces

  sandbox-egress-proxy:
    image: ${OSINARA_SANDBOX_EGRESS_PROXY_IMAGE:?OSINARA_SANDBOX_EGRESS_PROXY_IMAGE must be an exact digest reference}
    cap_drop:
      - ALL
    environment:
      # Only the proxy holds the Browserless key; sandboxes reach the provider through its
      # endpoint and see BROWSERLESS_AVAILABLE only.
      BROWSERLESS_API_KEY: ${BROWSERLESS_API_KEY-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(3128,'127.0.0.1').on('connect',function(){this.destroy();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network
      - sandbox-egress
    read_only: true
    restart: unless-stopped
    logging: *bounded-json-logs
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  postgres-data:
    name: osinara-production-postgres-data
  memory-embedding-model-e5:
    name: osinara-production-memory-embedding-model-e5
  google-workspace-credentials:
    name: osinara-production-google-workspace-credentials
  sandbox-data:
    name: osinara-production-sandbox-data
  tool-environments:
    name: osinara-production-tool-environments
  workspace-data:
    name: osinara-production-workspace-data

networks:
  app-network:
    name: osinara-production-app-network
  edge-frontend:
    name: osinara-production-edge-frontend
  sandbox-control:
    internal: true
    name: osinara-production-sandbox-control
  sandbox-egress:
    internal: true
    name: osinara-production-sandbox-egress
